[project]
name = "npq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
npq = "npq:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
